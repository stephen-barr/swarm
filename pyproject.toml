[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "swarm"
version = "0.1.0"
description = "Auction-based task allocation for heterogeneous drone swarms"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
]

[tool.setuptools.packages.find]
include = ["swarm*"]
namespaces = true

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.coverage.run]
omit = ["tempCodeRunnerFile.*", "tests/*"]